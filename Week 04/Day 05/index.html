<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 4 - Day 5: React Performance & Optimization</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="font-family: Arial, sans-serif; padding: 30px; background-color: #f8fafc; color: #1e293b;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, memo, Suspense } = React;

    // React.memo prevents Score from re-rendering unless 'value' changes
    const Score = memo(function Score({ value }) {
      console.log("Score rendered! (Optimized with React.memo)");
      return (
        <div style={{ padding: "12px", background: "#e0f2fe", borderRadius: "8px", marginTop: "12px", border: "1px solid #bae6fd" }}>
          <h3 style={{ margin: 0, color: "#0369a1" }}>Current Score: {value}</h3>
          <p style={{ margin: "4px 0 0", fontSize: "13px", color: "#0284c7" }}>
            ✔ Props didn't change, so this child component avoids re-rendering even though Timer ticks! Check browser console.
          </p>
        </div>
      );
    });

    function TimerGame() {
      const [time, setTime] = useState(0);

      useEffect(() => {
        const timer = setInterval(() => {
          setTime((prev) => prev + 1);
          console.log("Parent Game re-rendered (Time: " + (time + 1) + ")");
        }, 1000);

        return () => clearInterval(timer);
      }, [time]);

      return (
        <div style={{ padding: "20px", border: "1px solid #cbd5e1", borderRadius: "10px", background: "white", maxWidth: "450px" }}>
          <h2 style={{ marginTop: 0 }}>Timer: {time}s</h2>
          <p style={{ fontSize: "14px", color: "#64748b" }}>Parent component re-renders every 1 second.</p>
          <Score value={100} />
        </div>
      );
    }

    function AboutComponent() {
      return (
        <div style={{ padding: "15px", background: "#f0fdf4", border: "1px solid #bbf7d0", borderRadius: "8px", marginTop: "15px" }}>
          <h3 style={{ margin: 0, color: "#166534" }}>Lazy Loaded About Page</h3>
          <p style={{ margin: "6px 0 0", color: "#15803d", fontSize: "14px" }}>
            Simulated on-demand component loading to reduce initial bundle overhead!
          </p>
        </div>
      );
    }

    function App() {
      const [showAbout, setShowAbout] = useState(false);

      return (
        <div style={{ maxWidth: "600px", margin: "0 auto" }}>
          <h1>React Optimization (React.memo & Lazy Loading)</h1>

          <div style={{ margin: "25px 0" }}>
            <TimerGame />
          </div>

          <div style={{ margin: "25px 0", background: "white", padding: "20px", borderRadius: "10px", border: "1px solid #cbd5e1" }}>
            <h2>On-Demand Component Loading</h2>
            <button
              onClick={() => setShowAbout(!showAbout)}
              style={{ padding: "10px 18px", backgroundColor: "#16a34a", color: "white", border: "none", borderRadius: "6px", cursor: "pointer", fontWeight: "bold" }}
            >
              {showAbout ? "Hide Component" : "Load Component On Demand"}
            </button>

            {showAbout && <AboutComponent />}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
