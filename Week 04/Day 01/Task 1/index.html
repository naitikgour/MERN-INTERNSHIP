<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 4 - Day 1: React Router Navigation</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f8fafc; }
    .nav { padding: 15px 20px; background-color: #ffffff; border-bottom: 1px solid #e2e8f0; display: flex; gap: 20px; }
    .link { text-decoration: none; font-size: 16px; color: #475569; padding-bottom: 4px; cursor: pointer; }
    .link.active { color: #2563eb; font-weight: bold; border-bottom: 2px solid #2563eb; }
    .content { max-width: 800px; margin: 30px auto; padding: 20px; background: white; border-radius: 8px; border: 1px solid #e2e8f0; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function Home() {
      return (
        <div>
          <h2>Welcome to the Home Page</h2>
          <p>This is the main landing page of our multi-page React application.</p>
        </div>
      );
    }

    function About() {
      return (
        <div>
          <h2>About Us</h2>
          <p>We are learning React Router v6 to build modular single page applications.</p>
        </div>
      );
    }

    function Contact() {
      return (
        <div>
          <h2>Contact Page</h2>
          <p>Get in touch with us at contact@example.com or +91-9691-57-3040.</p>
        </div>
      );
    }

    function Dashboard() {
      return (
        <div>
          <h2>Dashboard Overview</h2>
          <p>Welcome to your personal dashboard analytics and metrics.</p>
        </div>
      );
    }

    function App() {
      const [currentRoute, setCurrentRoute] = useState("home");

      return (
        <div>
          <nav className="nav">
            <span className={`link ${currentRoute === "home" ? "active" : ""}`} onClick={() => setCurrentRoute("home")}>Home</span>
            <span className={`link ${currentRoute === "about" ? "active" : ""}`} onClick={() => setCurrentRoute("about")}>About</span>
            <span className={`link ${currentRoute === "contact" ? "active" : ""}`} onClick={() => setCurrentRoute("contact")}>Contact</span>
            <span className={`link ${currentRoute === "dashboard" ? "active" : ""}`} onClick={() => setCurrentRoute("dashboard")}>Dashboard</span>
          </nav>

          <main className="content">
            {currentRoute === "home" && <Home />}
            {currentRoute === "about" && <About />}
            {currentRoute === "contact" && <Contact />}
            {currentRoute === "dashboard" && <Dashboard />}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
