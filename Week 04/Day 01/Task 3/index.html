<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 4 - Day 1: Task 3 - Dynamic Route</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; background-color: #f8fafc;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function UserProfile({ id, onBack }) {
      return (
        <div style={{ padding: "20px", border: "1px solid #cbd5e1", borderRadius: "8px", maxWidth: "400px", margin: "20px auto", background: "white" }}>
          <h2>User Profile</h2>
          <p><strong>User ID:</strong> {id}</p>
          <p>Loaded dynamic details for user #{id} via parameter.</p>
          <button onClick={onBack} style={{ color: "white", backgroundColor: "#2563eb", border: "none", padding: "8px 16px", borderRadius: "4px", cursor: "pointer" }}>
            &larr; Back to Users
          </button>
        </div>
      );
    }

    function UserList({ onSelect }) {
      const users = [
        { id: 10, name: "Rahul Sharma" },
        { id: 25, name: "Priya Patel" },
        { id: 55, name: "Amit Verma" }
      ];

      return (
        <div style={{ maxWidth: "500px", margin: "20px auto", background: "white", padding: "20px", borderRadius: "8px", border: "1px solid #cbd5e1" }}>
          <h2>Select a User Profile (Dynamic Param)</h2>
          <ul style={{ listStyle: "none", padding: 0 }}>
            {users.map(u => (
              <li key={u.id} style={{ margin: "12px 0" }}>
                <button
                  onClick={() => onSelect(u.id)}
                  style={{ background: "none", border: "none", color: "#2563eb", fontSize: "16px", cursor: "pointer", textDecoration: "underline" }}
                >
                  View {u.name} (ID: {u.id})
                </button>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    function App() {
      const [selectedUserId, setSelectedUserId] = useState(null);

      return (
        <div>
          {selectedUserId ? (
            <UserProfile id={selectedUserId} onBack={() => setSelectedUserId(null)} />
          ) : (
            <UserList onSelect={(id) => setSelectedUserId(id)} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
