<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 6 - Day 6-7: Mini Project - Student Management API</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <header class="bg-gradient-to-r from-blue-700 via-indigo-700 to-purple-800 text-white rounded-2xl p-8 mb-8 shadow-xl">
      <span class="inline-block bg-white/20 text-white text-xs font-semibold px-3 py-1 rounded-full mb-3 uppercase tracking-wider">
        Week 6 • Day 6-7 Mini-Project
      </span>
      <h1 class="text-3xl font-extrabold tracking-tight">Student Management REST API</h1>
      <p class="text-indigo-100 mt-2 text-base">Node.js, Express.js, MongoDB Atlas, Mongoose Schema Validation, Pagination & Search</p>
    </header>

    <!-- Controls Bar -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm mb-8 flex flex-col md:flex-row gap-4 items-center justify-between">
      <div class="w-full md:w-1/2 relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
        <input id="search-input" type="text" placeholder="Search by student name or department..." oninput="handleSearch()" class="w-full pl-9 pr-4 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div class="flex items-center gap-3 w-full md:w-auto justify-end">
        <select id="sort-select" onchange="handleSearch()" class="p-2.5 text-xs border border-slate-200 rounded-xl bg-white font-medium">
          <option value="name">Sort by Name</option>
          <option value="rollNo">Sort by Roll No</option>
          <option value="year">Sort by Year</option>
        </select>
        <button onclick="openAddModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl flex items-center gap-2 shadow-sm">
          <i class="fa-solid fa-user-plus"></i> Add Student
        </button>
      </div>
    </div>

    <!-- Student Table -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden mb-8">
      <table class="w-full text-left text-xs text-slate-700">
        <thead class="bg-slate-50 font-bold uppercase text-slate-500 border-b border-slate-200">
          <tr>
            <th class="px-6 py-3.5">Roll No</th>
            <th class="px-6 py-3.5">Student</th>
            <th class="px-6 py-3.5">Department</th>
            <th class="px-6 py-3.5">Year</th>
            <th class="px-6 py-3.5 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="student-tbody" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </div>

  <script>
    let students = [
      { _id: "65fd0001", name: "Rahul Sharma", rollNo: 101, department: "Computer Science", year: 3, email: "rahul@example.com" },
      { _id: "65fd0002", name: "Ananya Sen", rollNo: 102, department: "Information Technology", year: 2, email: "ananya@example.com" },
      { _id: "65fd0003", name: "Vikram Malhotra", rollNo: 103, department: "Computer Science", year: 4, email: "vikram@example.com" },
      { _id: "65fd0004", name: "Sneha Roy", rollNo: 104, department: "Mechanical", year: 1, email: "sneha@example.com" },
      { _id: "65fd0005", name: "Arjun Das", rollNo: 105, department: "Civil", year: 2, email: "arjun@example.com" },
    ];

    function renderStudents(list = students) {
      const tbody = document.getElementById("student-tbody");
      tbody.innerHTML = "";
      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-slate-400">No student records found.</td></tr>`;
        return;
      }
      list.forEach(s => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50 transition";
        tr.innerHTML = `
          <td class="px-6 py-4 font-mono font-bold text-indigo-600">#${s.rollNo}</td>
          <td class="px-6 py-4">
            <div class="font-bold text-slate-900">${s.name}</div>
            <div class="text-[11px] text-slate-400 font-mono">${s.email}</div>
          </td>
          <td class="px-6 py-4"><span class="px-2.5 py-1 bg-slate-100 text-slate-700 rounded-md font-medium">${s.department}</span></td>
          <td class="px-6 py-4 font-semibold text-slate-600">Year ${s.year}</td>
          <td class="px-6 py-4 text-right space-x-2">
            <button onclick="editYear('${s._id}')" class="text-indigo-600 hover:text-indigo-800 font-semibold">Edit Year</button>
            <button onclick="deleteStudent('${s._id}')" class="text-rose-600 hover:text-rose-800 font-semibold">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function handleSearch() {
      const q = document.getElementById("search-input").value.toLowerCase();
      const sort = document.getElementById("sort-select").value;
      let filtered = students.filter(s => s.name.toLowerCase().includes(q) || s.department.toLowerCase().includes(q));
      filtered.sort((a,b) => a[sort] > b[sort] ? 1 : -1);
      renderStudents(filtered);
    }

    function openAddModal() {
      const name = prompt("Student Name:");
      if (!name) return;
      const rollNo = Number(prompt("Roll Number (unique):", "106"));
      const department = prompt("Department:", "Computer Science") || "Computer Science";
      const year = Number(prompt("Year (1-4):", "1")) || 1;
      const email = prompt("Email:", `${name.toLowerCase().replace(/\s+/g, '')}@example.com`);

      students.push({
        _id: "65fd" + (students.length + 10).toString(16),
        name,
        rollNo,
        department,
        year,
        email
      });
      handleSearch();
    }

    function editYear(id) {
      const s = students.find(x => x._id === id);
      if (!s) return;
      const newYear = prompt(`Update year for ${s.name}:`, s.year);
      if (newYear) {
        s.year = Number(newYear);
        handleSearch();
      }
    }

    function deleteStudent(id) {
      students = students.filter(s => s._id !== id);
      handleSearch();
    }

    renderStudents();
  </script>
</body>
</html>
