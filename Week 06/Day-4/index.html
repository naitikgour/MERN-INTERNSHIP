<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 6 - Day 4: Advanced CRUD & Query Operations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <header class="bg-gradient-to-r from-cyan-600 to-blue-700 text-white rounded-2xl p-8 mb-8 shadow-lg">
      <span class="inline-block bg-cyan-500/30 text-cyan-100 text-xs font-semibold px-3 py-1 rounded-full mb-3 uppercase tracking-wider">
        Week 6 • Day 4
      </span>
      <h1 class="text-3xl font-extrabold tracking-tight">Advanced CRUD & Query Operations</h1>
      <p class="text-cyan-100 mt-2 text-base">MongoDB operators ($gt, $lt, $in, $regex), pagination, sorting, and robust error handling</p>
    </header>

    <!-- Query Filter Bar -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm mb-8">
      <h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-filter text-cyan-600"></i> Query & Filter Console
      </h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Search Name ($regex)</label>
          <input id="search-name" type="text" placeholder="e.g. pro" oninput="applyFilters()" class="w-full text-xs p-2.5 border rounded-lg">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Category ($in / exact)</label>
          <select id="filter-cat" onchange="applyFilters()" class="w-full text-xs p-2.5 border rounded-lg bg-white">
            <option value="">All Categories</option>
            <option value="Electronics">Electronics</option>
            <option value="Grocery">Grocery</option>
            <option value="Furniture">Furniture</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Min Price ($gt)</label>
          <input id="min-price" type="number" placeholder="0" oninput="applyFilters()" class="w-full text-xs p-2.5 border rounded-lg">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Max Price ($lt)</label>
          <input id="max-price" type="number" placeholder="2500" oninput="applyFilters()" class="w-full text-xs p-2.5 border rounded-lg">
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-4 mt-4 pt-4 border-t border-slate-100 text-xs">
        <div class="flex items-center gap-2">
          <span class="text-slate-500 font-bold">Sort By:</span>
          <select id="sort-by" onchange="applyFilters()" class="p-1.5 border rounded-lg bg-white font-medium">
            <option value="price-asc">Price (Low to High)</option>
            <option value="price-desc">Price (High to Low)</option>
            <option value="name-asc">Name (A-Z)</option>
          </select>
        </div>
        <div class="flex items-center gap-2 font-mono text-cyan-700 bg-cyan-50 px-3 py-1.5 rounded-lg" id="active-url">
          GET /api/products/search?limit=4
        </div>
      </div>
    </div>

    <!-- Product Grid -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm mb-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-slate-900" id="results-count">Showing Products</h3>
        <div class="flex gap-2 text-xs">
          <button id="prev-btn" onclick="changePage(-1)" class="px-3 py-1 bg-slate-100 rounded hover:bg-slate-200 disabled:opacity-50">Prev</button>
          <span id="page-display" class="px-3 py-1 font-bold">Page 1</span>
          <button id="next-btn" onclick="changePage(1)" class="px-3 py-1 bg-slate-100 rounded hover:bg-slate-200 disabled:opacity-50">Next</button>
        </div>
      </div>

      <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
    </div>
  </div>

  <script>
    const allProducts = [
      { id: "1", name: "iPhone 15 Pro", price: 1200, category: "Electronics" },
      { id: "2", name: "MacBook Pro M3", price: 2000, category: "Electronics" },
      { id: "3", name: "Wireless Earbuds", price: 150, category: "Electronics" },
      { id: "4", name: "Organic Honey 500g", price: 25, category: "Grocery" },
      { id: "5", name: "Premium Almonds 1kg", price: 40, category: "Grocery" },
      { id: "6", name: "Ergonomic Desk Chair", price: 350, category: "Furniture" },
      { id: "7", name: "Standing Desk Electric", price: 600, category: "Furniture" },
      { id: "8", name: "Pro Gaming Mouse", price: 80, category: "Electronics" }
    ];

    let currentPage = 1;
    const limit = 4;

    function applyFilters() {
      const name = document.getElementById("search-name").value.toLowerCase();
      const category = document.getElementById("filter-cat").value;
      const minPrice = parseFloat(document.getElementById("min-price").value) || 0;
      const maxPrice = parseFloat(document.getElementById("max-price").value) || Infinity;
      const sort = document.getElementById("sort-by").value;

      let filtered = allProducts.filter(p => {
        if (name && !p.name.toLowerCase().includes(name)) return false;
        if (category && p.category !== category) return false;
        if (p.price < minPrice || p.price > maxPrice) return false;
        return true;
      });

      if (sort === "price-asc") filtered.sort((a,b) => a.price - b.price);
      if (sort === "price-desc") filtered.sort((a,b) => b.price - a.price);
      if (sort === "name-asc") filtered.sort((a,b) => a.name.localeCompare(b.name));

      const total = filtered.length;
      const maxPage = Math.max(1, Math.ceil(total / limit));
      if (currentPage > maxPage) currentPage = maxPage;

      const start = (currentPage - 1) * limit;
      const pageData = filtered.slice(start, start + limit);

      document.getElementById("results-count").textContent = `Showing ${pageData.length} of ${total} Products`;
      document.getElementById("page-display").textContent = `Page ${currentPage} of ${maxPage}`;
      document.getElementById("prev-btn").disabled = currentPage === 1;
      document.getElementById("next-btn").disabled = currentPage >= maxPage;

      const grid = document.getElementById("product-grid");
      grid.innerHTML = "";
      pageData.forEach(p => {
        const card = document.createElement("div");
        card.className = "p-4 border rounded-xl bg-slate-50 flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <span class="text-[10px] font-bold uppercase tracking-wider text-cyan-600 bg-cyan-100/60 px-2 py-0.5 rounded">${p.category}</span>
            <h4 class="font-bold text-slate-800 text-sm mt-2">${p.name}</h4>
          </div>
          <div class="mt-4 flex items-center justify-between">
            <span class="text-base font-extrabold text-slate-900">$${p.price}</span>
            <span class="text-[10px] text-slate-400 font-mono">ID: ${p.id}</span>
          </div>
        `;
        grid.appendChild(card);
      });

      const params = new URLSearchParams();
      if (name) params.append("name", name);
      if (category) params.append("category", category);
      if (minPrice > 0) params.append("minPrice", minPrice);
      if (maxPrice < Infinity) params.append("maxPrice", maxPrice);
      params.append("page", currentPage);
      params.append("limit", limit);
      params.append("sort", sort);
      document.getElementById("active-url").textContent = `GET /api/products/search?${params.toString()}`;
    }

    function changePage(delta) {
      currentPage += delta;
      applyFilters();
    }

    applyFilters();
  </script>
</body>
</html>
