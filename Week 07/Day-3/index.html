<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 7 - Day 3: User Login & JWT Token Generation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-8">
    <header class="bg-gradient-to-r from-violet-600 to-indigo-700 text-white rounded-2xl p-8 mb-8 shadow-xl">
      <span class="inline-block bg-white/20 text-white text-xs font-semibold px-3 py-1 rounded-full mb-3 uppercase tracking-wider">
        Week 7 • Day 3
      </span>
      <h1 class="text-3xl font-extrabold tracking-tight">User Login & JWT Token Generation</h1>
      <p class="text-violet-100 mt-2 text-base">bcrypt.compare password verification, jwt.sign token generation, expiry control, and 401 unauthorized handling</p>
    </header>

    <!-- Interactive Login Simulator -->
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm max-w-md mx-auto">
      <h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-arrow-right-to-bracket text-indigo-600"></i> Test /api/login Endpoint
      </h3>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Email</label>
          <input id="login-email" type="email" value="test@gmail.com" class="w-full text-xs p-2.5 border rounded-lg">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Password</label>
          <input id="login-pass" type="password" value="123456" class="w-full text-xs p-2.5 border rounded-lg">
        </div>
        <button onclick="simulateLogin()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-lg">
          POST /api/login
        </button>

        <div id="login-result" class="p-3 bg-slate-900 text-emerald-400 font-mono text-xs rounded-xl mt-4 hidden break-all"></div>
      </div>
    </div>
  </div>

  <script>
    function simulateLogin() {
      const email = document.getElementById("login-email").value;
      const pass = document.getElementById("login-pass").value;
      const resBox = document.getElementById("login-result");
      resBox.classList.remove("hidden");

      if (email === "test@gmail.com" && pass === "123456") {
        resBox.className = "p-3 bg-slate-900 text-emerald-400 font-mono text-xs rounded-xl mt-4 break-all";
        resBox.innerHTML = `
          <div class="font-bold mb-1">Status: 200 OK</div>
          <div>{<br>
            &nbsp;&nbsp;"message": "Login successful",<br>
            &nbsp;&nbsp;"token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjY1ZmEiLCJyb2xlIjoidXNlciJ9.98ab...",<br>
            &nbsp;&nbsp;"user": { "name": "Aman Verma", "role": "user" }<br>
          }</div>
        `;
      } else {
        resBox.className = "p-3 bg-rose-50 border border-rose-200 text-rose-700 font-mono text-xs rounded-xl mt-4";
        resBox.innerHTML = `
          <div class="font-bold mb-1">Status: 401 Unauthorized</div>
          <div>{ "error": "Invalid email or password" }</div>
        `;
      }
    }
  </script>
</body>
</html>
