<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 3 - Day 1: First React App</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; padding: 40px; background-color: #f9f9f9;">
  <div id="root"></div>

  <script type="text/babel">
    function Hello() {
      return <p>Hello from custom Hello component!</p>;
    }

    function App() {
      return (
        <div>
          <h1>Welcome to My First React App!</h1>
          <p>This app is built using React 19 </p>
          <Hello />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
