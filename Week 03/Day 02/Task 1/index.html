<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 3 - Day 2: Task 1</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0;">
  <div id="root"></div>

  <script type="text/babel">
    function Header() {
      return (
        <header style={{ backgroundColor: "#007bff", color: "white", padding: "10px" }}>
          <h1>My Portfolio</h1>
        </header>
      );
    }

    function Footer() {
      return (
        <footer style={{ backgroundColor: "#f1f1f1", padding: "10px", textAlign: "center" }}>
          <p>© 2025 My Portfolio | Built with in React</p>
        </footer>
      );
    }

    function App() {
      return (
        <div>
          <Header />
          <main style={{ padding: "20px", minHeight: "200px" }}>
            <h2>Welcome to My React App!</h2>
            <p>This is my first modular React layout.</p>
          </main>
          <Footer />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
